name: 广东电价数据采集

# =============================================================
# GitHub Actions 定时采集
# =============================================================
# 重要说明：
#   1. cron 时间用的是 UTC（世界标准时间），不是北京时间！
#      北京时间 = UTC + 8
#      所以要在北京时间 09:10 跑，就写 UTC 01:10
#   2. GitHub 的定时任务不精确，高峰期可能延迟 10-30 分钟，这是正常的
#   3. 公开仓库完全免费；私有仓库每月 2000 分钟（本任务月耗约 250 分钟）
#   4. 首次运行建议用 workflow_dispatch 手动触发一次，确认能跑通
# =============================================================

on:
  schedule:
    # 北京时间 06:10 -> UTC 22:10（前一天）  采集气象
    - cron: '10 22 * * *'
    # 北京时间 09:10 -> UTC 01:10           采集行情
    - cron: '10 1 * * *'
    # 北京时间 14:10 -> UTC 06:10           采集行情
    - cron: '10 6 * * *'
    # 北京时间 23:10 -> UTC 15:10           采集行情
    - cron: '10 15 * * *'
  # 允许手动点击按钮触发（新手调试就靠这个）
  workflow_dispatch:
    inputs:
      task:
        description: '采集任务'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - price
          - midlong
          - weather

# 允许工作流向仓库写入数据（提交采集结果）
permissions:
  contents: write

# 同一个时间只跑一个，避免并发写冲突
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------- 1. 拉取代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 2. 装 Python ----------
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ---------- 3. 装依赖（含 Chromium）----------
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      # ---------- 4. 恢复历史数据缓存（可选）----------
      - name: 恢复上次数据
        uses: actions/cache/restore@v4
        with:
          path: data/gd_power.sqlite
          key: gd-db-${{ github.run_number }}
          restore-keys: |
            gd-db-

      # ---------- 5. 执行采集 ----------
      - name: 采集数据
        run: |
          TASK="${{ github.event.inputs.task || 'all' }}"
          echo "本次任务：$TASK"
          python src/collector.py --only "$TASK" --export
          echo "--- 产出文件 ---"
          ls -la output/ || true

      # ---------- 6. 存档运行日志（失败时可用于排查）----------
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            output/
          retention-days: 30
          if-no-files-found: ignore

      # ---------- 7. 把采集结果提交回仓库 ----------
      - name: 提交数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi

      # ---------- 8. 保存数据库缓存 ----------
      - name: 保存数据库
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/gd_power.sqlite
          key: gd-db-${{ github.run_number }}
